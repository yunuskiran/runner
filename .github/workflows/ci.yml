name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Runner-Test-Only42!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Runner-Test-Only42!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_POSTGRES: Host=localhost;Username=postgres;Password=ci-test-only
      TEST_DATABASE_MSSQL: Server=localhost,1433;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Runner.sln --locked-mode
      - run: dotnet build Runner.sln -c Release --no-restore
      - run: dotnet test tests/Runner.Tests -c Release --no-build --logger 'trx;LogFileName=sqlite.trx'
      - run: dotnet test tests/Runner.Tests -c Release --no-build --logger 'trx;LogFileName=postgres.trx'
        env:
          TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-test-only
      - run: dotnet test tests/Runner.Tests -c Release --no-build --logger 'trx;LogFileName=mssql.trx'
        env:
          TEST_MSSQL: Server=localhost,1433;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - run: bash scripts/pack-plugin-sdk.sh
      - run: python3 scripts/verify-plugin-sdk.py
      - run: python3 scripts/cluster_smoke.py
        env:
          SMOKE_POSTGRES: Host=localhost;Database=runner_cluster_pg;Username=postgres;Password=ci-test-only
      - run: python3 scripts/cluster_smoke.py
        env:
          SMOKE_MSSQL: Server=localhost,1433;Database=runner_cluster_sql;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - run: python3 scripts/smoke.py
      - run: python3 scripts/smoke.py
        env:
          SMOKE_SCRIPTING: "true"
          SMOKE_OPERATIONS: "true"
          SMOKE_POSTGRES: Host=localhost;Database=runner_smoke;Username=postgres;Password=ci-test-only
      - run: python3 scripts/smoke.py
        env:
          SMOKE_SCRIPTING: "true"
          SMOKE_OPERATIONS: "true"
      - run: python3 scripts/package_smoke.py
      - run: python3 scripts/package_smoke.py
        env:
          SMOKE_POSTGRES: Host=localhost;Database=runner_packages_smoke;Username=postgres;Password=ci-test-only
      - run: python3 scripts/smoke.py
        env:
          SMOKE_SCRIPTING: "true"
          SMOKE_OPERATIONS: "true"
          SMOKE_MSSQL: Server=localhost,1433;Database=runner_mssql_smoke;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - run: python3 scripts/package_smoke.py
        env:
          SMOKE_MSSQL: Server=localhost,1433;Database=runner_mssql_packages_smoke;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - run: python3 scripts/platform_smoke.py
        env:
          SMOKE_POSTGRES: Host=localhost;Database=runner_platform_pg;Username=postgres;Password=ci-test-only
      - run: python3 scripts/platform_smoke.py
        env:
          SMOKE_MSSQL: Server=localhost,1433;Database=runner_platform_sql;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/browser-tests/package-lock.json
      - run: npm ci --prefix scripts/browser-tests --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/browser-tests
      - run: node -e "const fs=require('fs'),path=require('path'),p=require('./scripts/browser-tests/node_modules/playwright');fs.appendFileSync(process.env.GITHUB_ENV,'NODE_PATH='+path.resolve('scripts/browser-tests/node_modules')+'\nCHROMIUM_PATH='+p.chromium.executablePath()+'\n');"
      - run: node scripts/oidc_smoke.cjs
      - run: python3 scripts/platform_browser.py
      - run: python3 scripts/fault_smoke.py
        env:
          SMOKE_POSTGRES: Host=localhost;Database=runner_fault_pg;Username=postgres;Password=ci-test-only
      - run: python3 scripts/fault_smoke.py
        env:
          SMOKE_MSSQL: Server=localhost,1433;Database=runner_fault_sql;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
      - run: python3 scripts/load_smoke.py
        env:
          SMOKE_POSTGRES: Host=localhost;Database=runner_load_pg;Username=postgres;Password=ci-test-only
      - run: dotnet restore tools/Runner.Recovery --locked-mode
      - run: dotnet build tools/Runner.Recovery -c Release --no-restore
      - run: dotnet tools/Runner.Recovery/bin/Release/net10.0/Runner.Recovery.dll
        env:
          RECOVERY_PROVIDER: Postgres
          RECOVERY_CONNECTION: Host=localhost;Username=postgres;Password=ci-test-only
          RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
      - run: dotnet tools/Runner.Recovery/bin/Release/net10.0/Runner.Recovery.dll
        env:
          RECOVERY_PROVIDER: Mssql
          RECOVERY_CONNECTION: Server=localhost,1433;User ID=sa;Password=Runner-Test-Only42!;Encrypt=False
          RECOVERY_CONTAINER: ${{ job.services.mssql.id }}
      - run: dotnet publish src/Runner.Host -c Release --no-restore -o artifacts/publish
      - run: docker build -t runner:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: runner-plugin-sdk
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/checksums.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-validation
          path: |
            artifacts/load-*.json
            artifacts/recovery-*.json
            docs/images/worker-*.png
            docs/images/dependency-workflows.png
            docs/images/calendar-schedules.png
            docs/images/audit-trail.png
            tests/Runner.Tests/TestResults/*.trx
